# Validate art asset wiring (canon faces, outfits, props, checklists).
# Full LFS pull is required for strict validate against real binaries.
# If assets missing/empty and VALIDATE_ART_ALLOW_MISSING=1, script skips OK.
name: validate-art

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Validate art assets
        run: pnpm validate:art
        env:
          VALIDATE_ART_ALLOW_MISSING: "1"
