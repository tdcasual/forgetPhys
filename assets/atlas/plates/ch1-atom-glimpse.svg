  <rect x="36" y="36" width="1128" height="728" fill="none" stroke="#5c3d2e" stroke-width="3"/>
  <rect x="48" y="48" width="1104" height="704" fill="none" stroke="#8a6a3a" stroke-width="1.2" stroke-dasharray="4 6"/>
